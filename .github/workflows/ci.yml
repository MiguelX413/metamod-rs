name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    name: Rust workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Cache Cargo dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Check workspace
        run: cargo +stable check --locked --workspace --all-targets
      - name: Lint workspace
        run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo +stable test --locked --workspace

  linux-i686:
    name: Linux i686 ABI and loader
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Cache Cargo dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install 32-bit build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev g++-multilib lib32asan8 lib32ubsan1
          rustup toolchain install stable --profile minimal --target i686-unknown-linux-gnu
      - name: Verify ABI and run the loader with ASan, UBSan, and LSan
        env:
          RUSTUP_TOOLCHAIN: stable
          METAMOD_SANITIZE_LOADER: '1'
        run: bash verify/linux-i686.sh
      - name: Run the Rust plugins and C++ loader under ASan
        env:
          RUSTUP_TOOLCHAIN: stable
          METAMOD_SANITIZE_PLUGIN: '1'
          METAMOD_SANITIZER_CLANG: clang-18
          METAMOD_SANITIZER_CXX: clang++-18
        run: |
          sudo apt-get install -y clang-18 libclang-rt-18-dev
          rustup toolchain install nightly --profile minimal --target i686-unknown-linux-gnu
          bash verify/linux-i686.sh

  rust-asan:
    name: Rust AddressSanitizer and LeakSanitizer (Linux ${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            rustflags: -Zsanitizer=address --cfg metamod_lsan
          - arch: i686
            target: i686-unknown-linux-gnu
            # The i686 target supports instrumentation but does not bundle an ASan runtime.
            rustflags: -Zsanitizer=address -Zexternal-clangrt -Clinker=clang-18 -Clink-arg=-fsanitize=address --cfg metamod_lsan
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Cache Cargo dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install libclang and nightly Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev
          rustup toolchain install nightly --profile minimal --target "${{ matrix.target }}"
      - name: Install the external i686 sanitizer runtime
        if: matrix.arch == 'i686'
        run: sudo apt-get install -y clang-18 libclang-rt-18-dev g++-multilib
      - name: Run workspace library tests with AddressSanitizer and LeakSanitizer
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          ASAN_OPTIONS: detect_leaks=1
        run: cargo +nightly test --locked --workspace --lib --target "${{ matrix.target }}"

  windows-i686:
    name: Win32 ABI and loader
    runs-on: windows-2022
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Cache Cargo dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install the Rust Win32 target
        run: rustup target add i686-pc-windows-msvc
      - name: Build and verify the Win32 DLL
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b 1
          set "PATH=%LIBCLANG_PATH%;%PATH%"
          pwsh -NoProfile -File verify/windows-i686.ps1
